name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:          
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate growing snake SVGs
        run: python3 .github/snake/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
          SNAKE_INIT_LEN: "3"    
          SNAKE_MAX_LEN: "40"    
          SNAKE_STEP: "0.07"    

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
